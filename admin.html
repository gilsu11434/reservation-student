<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="창의융합프로젝트실 관리자 페이지">
  <title>관리자 - 창의융합프로젝트실</title>
  <link rel="stylesheet" href="./styles/style.css?v=20260809-report-approval-state">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./admin.html" aria-label="관리자 홈">
      <span class="brand-mark" aria-hidden="true">융</span>
      <span class="brand-copy">
        <strong>창의융합프로젝트실 관리자</strong>
        <small>207관 605-1호</small>
      </span>
    </a>

    <nav class="app-nav" aria-label="관리자 메뉴">
      <a class="nav-suggestion" href="./suggestions.html">건의사항</a>
      <a href="./index.html">이용 안내</a>
      <button id="refresh-button" type="button" class="header-button">새로고침</button>
      <button id="logout-button" type="button">로그아웃</button>
    </nav>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <p class="eyebrow">Administration</p>
        <h1>운영 관리</h1>
        <p>월간 달력에서 전체 예약 일정을 확인합니다.</p>
      </div>
    </div>

    <div id="admin-message" class="message" role="status"></div>

    <section class="card admin-calendar-card">
      <div class="admin-calendar-toolbar">
        <div>
          <p class="eyebrow">Reservations</p>
          <h2>전체 예약 현황</h2>
          <p class="muted">같은 날짜의 예약은 시작 시각 순서로 표시되며, 예약 건을 누르면 상세정보를 확인할 수 있습니다.</p>
        </div>

        <div class="admin-calendar-actions">
          <span class="admin-calendar-legend">
            <i aria-hidden="true"></i>
            빨간색은 시작 시각
          </span>
          <button id="calendar-today-button" type="button">오늘</button>
          <div class="admin-calendar-navigation" aria-label="달력 월 이동">
            <button id="calendar-prev-button" type="button" aria-label="이전 달">‹</button>
            <strong id="calendar-month-label" aria-live="polite"></strong>
            <button id="calendar-next-button" type="button" aria-label="다음 달">›</button>
          </div>
        </div>
      </div>

      <div class="admin-calendar-scroll">
        <div
          id="admin-reservation-calendar"
          class="admin-calendar-grid"
          aria-label="전체 예약 월간 달력"
        ></div>
      </div>
    </section>
  </main>

  <dialog
    id="reservation-detail-dialog"
    class="admin-reservation-dialog"
    aria-labelledby="reservation-detail-title"
  >
    <div class="admin-dialog-panel">
      <header class="admin-dialog-header">
        <div>
          <p class="eyebrow">Reservation details</p>
          <h2 id="reservation-detail-title">예약 상세정보</h2>
        </div>
        <button
          id="reservation-detail-close"
          class="admin-dialog-close"
          type="button"
          aria-label="예약 상세정보 닫기"
        >
          ×
        </button>
      </header>

      <div id="reservation-detail-content" class="admin-dialog-content"></div>
    </div>
  </dialog>

  <script type="module" src="./scripts/admin.js?v=20260809-design-professor"></script>
</body>
</html>
